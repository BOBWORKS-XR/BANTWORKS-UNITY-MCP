name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Node ${{ matrix.node }} MCP server
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release:server
      - run: npm run check:version
      - if: matrix.node == 20
        run: npm audit --audit-level=low

  launcher:
    name: Tauri launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:launcher
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-standalone.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-setup.ps1
      - run: cargo fmt --check
        working-directory: launcher/src-tauri
      - run: cargo test
        working-directory: launcher/src-tauri
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -Help
